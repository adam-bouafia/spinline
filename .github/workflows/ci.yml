name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux (Swift 6.3)
    runs-on: ubuntu-24.04
    container: swift:6.3-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version
      - name: Lint
        run: tools/dev.sh lint
      - name: Test
        run: tools/dev.sh test

  macos:
    name: macOS (Xcode)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Test
        run: tools/dev.sh test
